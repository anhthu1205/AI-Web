[project]
name = "ai-web-text2sql"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"app/schema_info.py" = ["E501"]
"app/services/prompt.py" = ["E501"]
"app/demo.py" = ["E501"]
"tests/**" = ["E501"]
